name: Ship systems and persistent lives
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Required public dependencies and JavaScript syntax
        run: python tools/validate_release.py
      - name: Unit and architecture regression tests
        run: node --test tests/*.test.cjs tests/*.test.js
      - name: Standalone local site, Git synchronization and publication integrity
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  browser:
    name: browser-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Run existing browser regressions
        run: python tools/run_browser_ci.py --shard ${{ matrix.shard }} --shards 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  regression:
    needs: [unit, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every unit and browser group to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$UNIT_RESULT" = success && test "$BROWSER_RESULT" = success
  deploy:
    name: Publish vexedmirror.com
    needs: regression
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: vexedmirror-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://vexedmirror.com/html-games/broken-mirror-port/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that this is still the latest main commit
        id: latest
        shell: bash
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on main; its checked workflow will publish it."
          fi
      - name: Publish exact Git bytes and verify public SHA-256 hashes
        if: steps.latest.outputs.publish == 'true'
        env:
          VEXED_FTP_HOST: ${{ secrets.VEXED_FTP_HOST }}
          VEXED_FTP_USERNAME: ${{ secrets.VEXED_FTP_USERNAME }}
          VEXED_FTP_PASSWORD: ${{ secrets.VEXED_FTP_PASSWORD }}
        run: python tools/publish_site.py

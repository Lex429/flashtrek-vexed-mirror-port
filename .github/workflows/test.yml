name: Ship systems and persistent lives
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and architecture regression tests
        run: node --test tests/*.test.cjs tests/*.test.js
      - name: Standalone local site and Git synchronization
        run: python -m unittest discover -s tests -p test_local_site.py -v
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Flight, jobs, combat and showcase browser smoke
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-smoke.py
      - name: Beam attachments and shield/hull alignment in a real browser
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-ship-contract.py
      - name: Rearward beam targeting, physical interception and rotating shield contacts
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-beam-targeting.py
      - name: Civilian live-shot awareness, survival policies and preserved jobs
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-civilian-tactics.py
      - name: Held fire, steering-preserving selection and fitted weapon feedback
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-combat-controls.py
      - name: Full fleet dimensions, four damage frames and player/NPC lighting parity
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-ship-presentation.py
      - name: Setup showcase lighting, animation lifecycle and screen fit
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-setup-preview.py
      - name: Typed equipment, real hull purchases, six drone bays and mode-separated saves
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-unified-equipment.py
      - name: Asteroid weapon hits, physical hull pushes, local contact glints and saved drift
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-asteroid-physics.py
      - name: Ship collisions, shared traffic avoidance and blocked-delivery reload
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-ship-traffic.py
      - name: Hull-clear shield passage, angular impacts and actual player movement keys
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-impact-controls.py
      - name: Persistent freighter life, observer inspection and distant delivery
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-npc-lives.py
      - name: Live Dot repair nozzles, saved simulation, hull restoration and destruction
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-ship-repairs.py
      - name: Audited Earth traffic jam in local flight and Dev inspector
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-earth-jam.py
      - name: Galaxy map dragging, zoom, ship search and following
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-galaxy-controls.py
      - name: Remote regional mining, local refinery and mineral engineering
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-regional-mining.py
      - name: Deuranium damage artwork, player refinery and Olympic mining to rescue
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-deuranium-mining.py
      - name: Offscreen mining preserves gameplay without drawing ore effects
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-ore-performance.py --label ci
      - name: Civilian exclusions and mining-only visits to empty systems
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-civilian-access.py
      - name: Player lighting, damage stages and warp pixel regressions
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-render-paths.py --visual-only --label ci
      - name: Cold damage artwork, pause and map preparation boundaries
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-stability.py --label ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-results
          path: test-results/

name: Ship systems and persistent lives
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and architecture regression tests
        run: node --test tests/*.test.cjs tests/*.test.js
      - name: Standalone local site and Git synchronization
        run: python -m unittest discover -s tests -p test_local_site.py -v
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Flight, jobs, combat and showcase browser smoke
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-smoke.py
      - name: Beam attachments and shield/hull alignment in a real browser
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-ship-contract.py
      - name: Rearward beam targeting, physical interception and rotating shield contacts
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-beam-targeting.py
      - name: Retained GPU shield pixels, default gameplay, pause and context recovery
        env:
          BROWSER_CHANNEL: ''
        run: |
          python tests/browser-shield-gpu-visuals.py --output test-results/shield-gpu-design
          python tests/browser-shield-gpu-live.py
          git fetch --no-tags --depth=1 origin ab5bb2504957c1de4cf239bfee882b810e1128e2
          mkdir -p test-results/shield-cinematic-baseline
          git show ab5bb2504957c1de4cf239bfee882b810e1128e2:html-games/flashtrek-broken-mirror/shield-gpu.js > test-results/shield-cinematic-baseline/shield-gpu.js
          python tests/browser-shield-cinematic.py --baseline test-results/shield-cinematic-baseline --output test-results/shield-cinematic
      - name: Civilian live-shot awareness, survival policies and preserved jobs
        env:
          BROWSER_CHANNEL: ''
        run: |
          python tests/browser-civilian-tactics.py
          python tests/browser-faction-defence.py
      - name: Held fire, steering-preserving selection and fitted weapon feedback
        env:
          BROWSER_CHANNEL: ''
        run: |
          python tests/browser-combat-controls.py
          python tests/browser-shield-maintenance.py
          python tests/browser-engine-failure.py
          python tests/browser-thrusters.py
      - name: Reverse, exact stop, turnaround and contextual long-range targeting
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-flight-feel.py
      - name: Reused lighting surfaces, animation cadence and turning damage states
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-ship-lighting.py
      - name: Incremental artwork pixels and reusable painted lamp textures
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-incremental-art.py
      - name: Bounded optional artwork worker, original pixel algorithms and explicit readiness
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-optional-art-worker.py
      - name: Shared spatial scenes, complete catch-up and durable reload
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-spatial-performance.py
      - name: Cold physical debris, original topology and camera-independent contacts
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-debris-geometry.py
      - name: Fixed display-independent physics, interpolation and 5000-record verified reload
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-foundation.py
      - name: Warp bearings, destination readiness and durable retry/resume
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-warp-transition.py
      - name: Warp zoom raster reuse, live lighting and artwork
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-warp-rendering.py
      - name: Aries Dev selection, nacelle charge and powered ship roster
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-warp-charge-ships.py
      - name: Visible warp disappearance point, starburst and paused flash
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-warp-departure.py
      - name: Shared NPC departures, simultaneous starbursts and preserved fleet
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-npc-warp.py
      - name: Distance-based body navigation, cruise override and visible cancellation
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-cruise-navigation.py
      - name: Active chunk boundaries, sleeping journeys, launched shots and full worker checkpoint reload

name: Ship systems and persistent lives
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and architecture regression tests
        run: node --test tests/*.test.cjs tests/*.test.js
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Flight, jobs, combat and showcase browser smoke
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-smoke.py
      - name: Beam attachments and shield/hull alignment in a real browser
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-ship-contract.py
      - name: Persistent freighter life, observer inspection and distant delivery
        env:
          BROWSER_CHANNEL: ''
        run: python tests/browser-npc-lives.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-results
          path: test-results/

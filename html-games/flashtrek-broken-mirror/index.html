<script>
const viewport=document.getElementById('viewport'),game=document.getElementById('game');
const flightStatus=document.createElement('section');flightStatus.id='flight-status';flightStatus.setAttribute('aria-label','Flight updates');viewport.appendChild(flightStatus);
const sound=document.getElementById('sound'),size=document.getElementById('size');
let player,large=false,audible=true;
function resizeGame(){const padding=document.fullscreenElement?24:innerWidth<=640?24:40;const flight=Number(game.dataset.frame)===154;flightStatus.hidden=!flight;const gutter=flight?Math.min(210,viewport.clientWidth*.24):0;const aw=Math.max(1,viewport.clientWidth-padding-(flight?gutter+12:0)),ah=Math.max(1,viewport.clientHeight-padding);const cap=large||document.fullscreenElement?Infinity:900;const width=Math.min(aw,ah*4/3,cap);game.style.width=width+'px';game.style.height=width*3/4+'px';flightStatus.style.width=gutter+'px';flightStatus.style.height=width*3/4+'px';}
new ResizeObserver(resizeGame).observe(flightStatus);
function focusGame(){if(Number(game.dataset.frame)===154)player?.focus();}
// Restore flight input after interacting with page controls or returning to the game.
game.addEventListener('pointerdown',event=>{if(Number(game.dataset.frame)===154&&!event.target.closest?.('section,button,input,select,textarea'))requestAnimationFrame(focusGame);});
window.addEventListener('focus',focusGame);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)focusGame();});
document.addEventListener('keydown',event=>{
 if(Number(game.dataset.frame)!==154||!player)return;
 const target=event.composedPath()[0];
 if(target?.matches?.('input,textarea,select,[contenteditable="true"]'))return;
 if(target?.closest?.('[role="dialog"]'))return;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(event.code)){
  focusGame();
  event.preventDefault();
 }
},true);
function updateNote(){document.getElementById('display-note').textContent='Enhanced view \u00b7 '+(large?'Larger':'Comfortable')+' size';}
new ResizeObserver(resizeGame).observe(viewport);
size.onclick=()=>{large=!large;size.setAttribute('aria-pressed',String(large));resizeGame();updateNote();focusGame();};
const music=document.getElementById('menu-music'),menuArt=document.getElementById('menu-art');
let menuMusicActive=true;
function syncMusic(){music.volume=.65;if(audible&&menuMusicActive)music.play().catch(()=>{});else music.pause();}
function syncSound(){if(player)player.ruffle().volume=audible?1:0;sound.setAttribute('aria-pressed',String(audible));sound.textContent=audible?'Sound on':'Sound off';syncMusic();window.vexRebirthSoundMute?.(!audible);}
sound.onclick=()=>{audible=!audible;syncSound();if(audible){for(const context of gameAudioContexts)context.resume().catch(()=>{});player?.ruffle().resume();}focusGame();};
for(const event of ['pointerdown','keydown'])document.addEventListener(event,()=>syncMusic(),{capture:true});
game.addEventListener('pointermove',event=>{const r=game.getBoundingClientRect();const dx=event.clientX-r.left-r.width*.5,dy=event.clientY-r.top-r.height*(228/450);if(Math.hypot(dx,dy)>4)menuArt.querySelector('.menu-pointer').style.transform='rotate('+(Math.atan2(dy,dx)*180/Math.PI-90)+'deg)';});
function gameState(frame){game.dataset.frame=String(frame);syncGameLoading(frame);renderDeath(frame);resizeGame();requestAnimationFrame(()=>{if(Number(game.dataset.frame)===frame){renderSetup(frame);renderSaves(frame);renderTrade(frame);renderGalaxyMap(frame);renderSol(frame);renderRadar(frame);if(frame===154)focusGame();}});menuArt.hidden=frame!==106;menuMusicActive=frame<147;syncMusic();}
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await viewport.requestFullscreen();focusGame();}catch{document.getElementById('connection').textContent='Full screen unavailable';}};
document.addEventListener('fullscreenchange',()=>{resizeGame();focusGame();});
const bootDelay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
window.addEventListener('DOMContentLoaded',async()=>{
 const status=document.getElementById('status'),intro=document.getElementById('startup');
 status.hidden=true;resizeGame();syncSound();
 let progressFrame=0;
 let signalMenuReady;const menuReady=new Promise(resolve=>signalMenuReady=resolve);
 try {
  player=window.RufflePlayer.newest().createPlayer();game.appendChild(player);
  const cursorStyle=document.createElement('style');
  cursorStyle.textContent=':host,:host *{cursor:default!important}';
  player.shadowRoot.appendChild(cursorStyle);
  const progress=intro.querySelector('.boot-progress');
  const progressFill=progress.querySelector('span');
  const setProgress=value=>{progress.setAttribute('aria-valuenow',String(Math.round(value)));progressFill.style.transform='scaleX('+(value/100)+')';};
  let backgroundReady=false,downloadFraction=0,runtimeReady=false,shownProgress=0,lastProgressTime=performance.now();
  const stage=document.createElement('p');stage.className='boot-stage';intro.appendChild(stage);
  const progressFinished=new Promise(resolve=>{
   function animateProgress(now){
    const assets=window.vexShipVisualLoading||{done:0,total:66};
    const fraction=.2*downloadFraction+.2*Number(runtimeReady)+.6*Math.min(1,assets.done/assets.total);
    // Follow completed work; leave completion for the menu-ready signal.
    const target=backgroundReady?100:94*Math.pow(fraction,1.5);
    const dt=Math.max(0,now-lastProgressTime);lastProgressTime=now;
    shownProgress+=(target-shownProgress)*(1-Math.exp(-dt/(backgroundReady?70:350)));
    setProgress(shownProgress);
    stage.textContent=backgroundReady?'Ready':downloadFraction<1?'Loading game':!runtimeReady?'Starting game':assets.done<assets.total?`Preparing ships ${assets.done} / ${assets.total}`:'Opening menu';
    progress.setAttribute('aria-valuetext',stage.textContent);
    if(backgroundReady&&100-shownProgress<.1){setProgress(100);progressFrame=0;resolve();return;}
    progressFrame=requestAnimationFrame(animateProgress);
   }
   progressFrame=requestAnimationFrame(animateProgress);
  });
  const observeTrace=message=>{
   if(message==='VEXED_MIRROR_MENU_READY'||message==='VEX_STATE:106'){game.dataset.menuReady='true';signalMenuReady();}
   if(message.startsWith('VEX_STATE:'))gameState(Number(message.slice(10)));
  };
  // Subscribe before loading: a fast cached game can reach its menu during load().
  player.ruffle().traceObserver=observeTrace;
  const response=await fetch('BROKENMIRROR.swf?v=weapon-independent-1');if(!response.ok)throw Error('Game download failed');
  const totalBytes=Number(response.headers.get('content-length'));
  const reader=response.body.getReader();const chunks=[];let received=0;
  while(true){const {done,value}=await reader.read();if(done)break;chunks.push(value);received+=value.length;downloadFraction=totalBytes>0?Math.min(1,received/totalBytes):received/(received+8000000);}
  const data=new Uint8Array(received);let offset=0;for(const chunk of chunks){data.set(chunk,offset);offset+=chunk.length;}
  downloadFraction=1;
  await player.ruffle().load({data,fileName:'BROKENMIRROR.swf'});
  syncSound();sound.disabled=false;
  runtimeReady=true;player.ruffle().traceObserver=observeTrace;
  await Promise.all([menuReady,window.vexShipVisualAssetsReady,...Array.from(intro.querySelectorAll('img'),img=>img.decode())]);
  backgroundReady=true;
  await progressFinished;
  menuSpace.prepare();
  intro.querySelector('.boot-ship').style.opacity='0';progress.style.opacity='0';stage.style.opacity='0';
  intro.querySelector('.flash').style.opacity='1';intro.querySelector('.mirror').style.opacity='1';
  await bootDelay(350);intro.style.opacity='0';await bootDelay(350);intro.hidden=true;
  document.getElementById('connection').textContent='Systems online';resizeGame();player.focus();
 }catch(error){cancelAnimationFrame(progressFrame);intro.hidden=true;status.hidden=false;status.textContent='The game could not load. Refresh the page to try again.';document.getElementById('connection').textContent='Connection interrupted';console.error(error);}
});
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vexed Mirror · System atlas</title>
<style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#060b12;color:#dce8ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 0,#15304766,transparent 60%)}main{max-width:1440px;margin:auto;padding:28px 36px}header{display:flex;justify-content:space-between;gap:24px;align-items:center;border-bottom:1px solid #294252;padding-bottom:22px}small,.kind{color:#83b9ca;text-transform:uppercase;letter-spacing:.14em;font-size:11px}h1{font-weight:500;font-size:32px;margin:6px 0}p{color:#a4bac9;line-height:1.6;max-width:100ch}a{color:#91dbe8;text-decoration:none}button,select{font:inherit;color:inherit;border:1px solid #355064;background:#0f202d;border-radius:5px;padding:9px 13px}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:24px 0}.world{border:1px solid #243949;border-radius:10px;background:linear-gradient(145deg,#14243199,#09111c);padding:20px;min-height:310px}.art{height:205px;display:flex;align-items:center;justify-content:center}.art img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 12px 24px #0006)}h2{font-size:18px;font-weight:500;margin:12px 0 8px}.world p{font-size:12px;margin:5px 0}.evidence{color:#8ea7ba;font-size:11px}.paging{display:flex;justify-content:space-between;align-items:center;gap:16px}#notes{font-size:13px}.source{font-size:12px;padding-top:16px;border-top:1px solid #263948}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #8ce3ef;outline-offset:4px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:20px}header{align-items:flex-start;flex-direction:column}}@media(max-width:460px){.grid{grid-template-columns:1fr}.art{height:220px}}
</style>
</head>
<body><main>
<header><div><small>Vexed Mirror · Navigation archive</small><h1 id="title">System atlas</h1><span id="count"></span></div><div class="controls"><label for="system">Solar system</label><select id="system"></select><a href="index.html">Return to game ↗</a></div></header>
<p id="notes"></p>
<div class="grid" id="worlds" aria-live="polite"></div>
<div class="paging"><span id="page-label"></span><div class="controls"><button id="previous">Previous bodies</button><button id="next">Next bodies</button></div></div>
<p class="source">Screen-supported worlds, licensed references, astronomy, and original game additions remain distinct. Artwork and chart spacing are interpretations. <a href="../../docs/research/system-lore/README.md">Read the source-linked research ↗</a></p>
</main>
<script src="world-data.js?v=blended-map-20261025"></script><script src="system-catalog-data.js?v=orbital-layout-20261025-1"></script><script src="system-catalog.js?v=orbital-layout-20261025-1"></script>
<script>
(()=>{'use strict';const catalog=nativeSystemCatalog,select=document.getElementById('system'),worlds=document.getElementById('worlds');let page=0;
const safe=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
select.innerHTML=catalog.records.map(r=>`<option value="${r.id}">${safe(r.name)}${r.id===1?'': ' system'}</option>`).join('');
function render(){const r=catalog.get(Number(select.value)),bodies=catalog.bodies(r.id).filter(b=>!b.occludedBy),size=4,total=Math.ceil(bodies.length/size);page=Math.max(0,Math.min(page,total-1));document.getElementById('title').textContent=r.name+' system';document.getElementById('count').textContent=`${bodies.length} charted bodies · ${catalog.records.length} systems · ${VexedMirrorSystemData.originalDestinations} original destinations + ${VexedMirrorSystemData.additionalDestinations} new`;document.getElementById('notes').textContent=r.notes;worlds.innerHTML=bodies.slice(page*size,page*size+size).map(b=>{const parent=b.parentId===undefined?null:bodies.find(p=>p.id===b.parentId);const evidence=catalog.evidenceLabel(b),orbit=catalog.orbitDescription(b,r.id);return `<article class="world"><div class="art"><img src="${safe(b.art)}" alt="${safe(b.name)}"></div><h2>${safe(b.name)}</h2><span class="kind">${safe(b.kind.replaceAll('_',' '))}</span>${parent?`<p>Orbits ${safe(parent.name)}</p>`:''}<p class="evidence">${safe(evidence)}</p>${orbit?`<p>${safe(orbit)}</p>`:''}<p>${safe(b.description)}</p>${b.legacyWorldId?'<p>'+(b.legacyWorldId<=52?'Original game destination · existing population and services retained':'Additional game destination · population is a game estimate')+'</p>':''}</article>`;}).join('');document.getElementById('page-label').textContent=`Bodies ${page*size+1}–${Math.min((page+1)*size,bodies.length)} of ${bodies.length}`;document.getElementById('previous').disabled=page===0;document.getElementById('next').disabled=page===total-1;}
select.onchange=()=>{page=0;render()};document.getElementById('previous').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};const initial=Number(new URLSearchParams(location.search).get('system'));if(catalog.get(initial))select.value=catalog.physicalId(initial);render();})();
</script>
</body></html>

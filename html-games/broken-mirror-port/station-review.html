<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Broken Mirror / Station upgrades</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#e8edf4;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{font-size:24px;margin:0 0 8px}p{color:#99a9bf;line-height:1.6}a{color:#ee9ba4}select,button{font:inherit;color:#e8edf4;background:#1b222d;border:1px solid #3a4658;border-radius:6px;padding:10px}nav{display:flex;gap:18px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0 36px}.panel{border:1px solid #354152;background:#080b10;border-radius:8px;overflow:hidden}.label{padding:12px 16px;background:#151c26;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.upgraded .label{color:#ffd6d8;background:#39262d}.stage{aspect-ratio:4/3}ruffle-player{display:block;width:100%;height:100%}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{padding:12px;border:1px solid #2c3747;border-radius:8px;background:radial-gradient(ellipse at 50% 40%,#182536,#0b1018 70%);text-align:center}.card img{width:100%;aspect-ratio:1;object-fit:contain}.card button{width:100%;border:0;background:transparent;cursor:pointer}.card button:hover{background:#253144}.card a{font-size:12px}#status{font-size:13px;color:#b4c3d7}a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #ff9598;outline-offset:3px}@media(max-width:750px){main{padding:20px 14px}.gallery{grid-template-columns:repeat(2,1fr)}.compare{gap:8px}.label{padding:10px;font-size:10px}h1{font-size:21px}}
</style><script>window.RufflePlayer={config:{autoplay:'on',unmuteOverlay:'hidden',backgroundColor:'#080b10',allowScriptAccess:false,openUrlMode:'deny',allowNetworking:'internal'}};</script><script src="../canyon-defence/ruffle/ruffle.js"></script></head>
<body><main><header><div><h1>Stations of Broken Mirror</h1><p>All 21 station types, with detailed hulls, docking structures and lighting.</p></div><nav><a href="index.html">Back to game</a><a href="ship-review.html">View fleet</a><a href="planet-review.html">View planets</a></nav></header><label for="station">Compare a station </label><select id="station"></select><p id="status" role="status">Preparing station comparison...</p><section class="compare" aria-label="Original and upgraded station in the game renderer"><div class="panel"><div class="label">Original</div><div id="original" class="stage"></div></div><div class="panel upgraded"><div class="label">Upgraded / Same display size</div><div id="upgraded" class="stage"></div></div></section><div id="gallery" class="gallery" aria-label="All upgraded stations"></div></main>
<script>
const base='art-review/stations/',select=document.getElementById('station');let catalog=[],players=[],loading=false;
async function showStation(id){if(loading)return;loading=true;select.disabled=true;const entry=catalog.find(p=>p.id===Number(id));select.value=String(id);try{await Promise.all(players.map((p,i)=>p.ruffle().load(base+id+(i?'-upgraded':'-original')+'.swf')));document.getElementById('status').textContent=entry.name+' / Original and upgraded station rendered at the same size.';}catch(e){document.getElementById('status').textContent='Could not load this station.';throw e;}finally{loading=false;select.disabled=false;}}
window.addEventListener('DOMContentLoaded',async()=>{catalog=await(await fetch(base+'catalog.json')).json();for(const entry of catalog){const option=document.createElement('option');option.value=entry.id;option.textContent=entry.name;select.appendChild(option);const card=document.createElement('article');card.className='card';card.innerHTML='<button type="button"><img src="'+base+entry.id+'.png" alt="'+entry.name+' upgraded station" loading="lazy"><span>'+entry.name+'</span></button><a href="'+base+entry.id+'.png">Full-resolution artwork</a>';if(entry.id===302){const portal=document.createElement('a');portal.href=base+'303.png';portal.textContent=' / Portal artwork';card.appendChild(portal);}card.querySelector('button').onclick=()=>{showStation(entry.id);document.querySelector('.compare').scrollIntoView({behavior:'smooth',block:'center'});};document.getElementById('gallery').appendChild(card);}for(const id of ['original','upgraded']){const p=window.RufflePlayer.newest().createPlayer();document.getElementById(id).appendChild(p);players.push(p);}select.onchange=()=>showStation(select.value);await showStation(272);});
</script></body></html>

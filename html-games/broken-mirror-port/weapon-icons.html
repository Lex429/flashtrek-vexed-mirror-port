<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vexed Mirror · Weapon icons</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 36'%3E%3Cpath d='M16 2 29 32 16 24 3 32Z' fill='none' stroke='%23eb8c96' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090e15;color:#edf3fa;font:14px/1.6 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:30px 20px}a{color:#88dcdf}h1{margin:20px 0 5px;font-size:32px}p{color:#a3b6c7}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{font:inherit;padding:8px 14px;border:1px solid #3c5363;border-radius:6px;background:#182531;color:#e5eef5;cursor:pointer}button[aria-pressed=true]{border-color:#88dcdf;color:#88dcdf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.card{border:1px solid #293746;border-radius:8px;overflow:hidden;background:#111a25}.preview{background:#172632;padding:12px;aspect-ratio:1;display:grid;place-items:center}.preview img{width:100%;height:100%;object-fit:contain}.light .preview{background:#d6e2e9}.caption{padding:12px;font-size:12px}.caption small{display:block;color:#9eb4c5;margin-top:3px}button:focus-visible,a:focus-visible{outline:2px solid #88dcdf;outline-offset:4px}
</style></head><body><main><a href="damage-showcase.html">← Back to weapon tests</a><h1>Remastered weapon icons</h1><p id="status">Loading icons…</p><div class="tools" aria-label="Preview background"><button id="dark" aria-pressed="true">Dark background</button><button id="light" aria-pressed="false">Light background</button></div><div id="icons" class="grid"></div></main>
<script>
(async()=>{try{const response=await fetch('showcase-assets/combat-data.json?v=weapon-remasters-1');if(!response.ok)throw Error('Could not load icons');const data=await response.json(),weapons=Object.values(data.weapons).flat(),equipment=data.equipment;for(const w of [...weapons,...equipment].sort((a,b)=>a.id-b.id)){const card=document.createElement('article');card.className='card';const preview=document.createElement('div');preview.className='preview';const image=document.createElement('img');image.src='showcase-assets/'+w.icon;image.alt=w.name;preview.append(image);const caption=document.createElement('div');caption.className='caption';caption.textContent=w.name;const note=document.createElement('small');note.textContent=weapons.includes(w)?'Base damage '+w.baseDamage:'Special equipment';caption.append(note);card.append(preview,caption);document.getElementById('icons').append(card);}document.getElementById('status').textContent=`${weapons.length} firing weapons · ${equipment.length} special equipment icons. Switch backgrounds to inspect the transparent edges.`;}catch(e){document.getElementById('status').textContent=e.message;}})();
for(const id of ['dark','light'])document.getElementById(id).onclick=()=>{document.body.classList.toggle('light',id==='light');for(const key of ['dark','light'])document.getElementById(key).setAttribute('aria-pressed',String(key===id));};
</script></body></html>

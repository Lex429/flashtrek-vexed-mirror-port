setTimeout(()=>boot.classList.add('finishing'),1600);
setTimeout(()=>{
 menuArt.hidden=false;
 menuSpace.prepare();
 requestAnimationFrame(()=>{boot.style.opacity='0';});
 setTimeout(()=>{boot.hidden=true;document.getElementById('connection').textContent='Main menu';},480);
},2000);
game.addEventListener('pointermove',event=>{if(menuArt.hidden)return;const r=menuArt.getBoundingClientRect(),dx=event.clientX-r.left-r.width/2,dy=event.clientY-r.top-r.height*(228/450);if(Math.hypot(dx,dy)>4)menuArt.querySelector('.menu-pointer').style.transform=`rotate(${Math.atan2(dy,dx)*180/Math.PI-90}deg)`;});
